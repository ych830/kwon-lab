# 사이트 전체 설정. 이 파일을 바꾸면 로컬 미리보기(jekyll serve)는 껐다 켜야 반영된다.
# 연구실 이름·연락처 같은 내용은 여기가 아니라 _data/lab.yml 에서 고친다.

title: OOO Lab
url: "https://ych830.github.io"
baseurl: "/kwon-lab"   # 주소 뒤 경로. 독자 도메인(예: lab.university.ac.kr)을 연결하면 "" 로 바꾼다.
timezone: Asia/Seoul

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .agent-out
