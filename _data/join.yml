# 학생 모집(함께하기) 페이지 내용. 연락처는 lab.yml 의 email·address 를 쓴다.
# ※ 아래는 예시 문구다. 실제 조건에 맞게 고칠 것.

lead:
  ko: 인공지능을 깊이 공부하고, 그것으로 실제 문제를 풀어 보고 싶은 학생을 기다립니다. 지금 실력보다 끝까지 파고드는 태도를 더 중요하게 봅니다.
  en: We are looking for students who want to study AI in depth and use it to solve real problems. We value persistence and curiosity more than current skill level.

positions:
  - title:
      ko: 석사·박사과정
      en: M.S. / Ph.D. Students
    desc:
      ko: 연구실 주제 중 하나를 깊게 연구하고 국내외 학회·저널에 논문을 냅니다. 석박사 통합과정도 지원할 수 있습니다.
      en: Conduct in-depth research on one of our topics and publish at international venues. Integrated M.S.–Ph.D. applicants are welcome.
  - title:
      ko: 학부연구생
      en: Undergraduate Interns
    desc:
      ko: 한 학기 이상 함께하며 대학원생과 같은 프로젝트에 참여합니다. 대학원 진학을 고민하는 학생에게 추천합니다.
      en: Join for at least one semester and work on projects alongside graduate students. Recommended for students considering graduate school.

looking_for:
  - ko: 기계학습·딥러닝에 관심이 있고 Python 으로 코드를 짤 수 있는 학생
    en: Interest in machine learning and deep learning, and able to code in Python
  - ko: 논문을 읽고 직접 구현해 보는 것을 즐기는 학생
    en: Enjoy reading papers and implementing them yourself
  - ko: 동료와 생각을 나누고 함께 문제를 푸는 학생
    en: Like sharing ideas and solving problems with others

offer:
  - ko: 연구 과제 참여에 따른 인건비 지원
    en: Financial support through research projects
  - ko: 개인 연구용 GPU 서버 환경
    en: Dedicated GPU servers for research
  - ko: 국내외 학회 발표·참가 지원
    en: Support for presenting at domestic and international conferences
  - ko: 매주 1:1 연구 미팅
    en: Weekly one-on-one research meetings

apply:
  - ko: 이력서(CV)와 성적표, 관심 연구 주제를 적어 이메일로 보내 주세요.
    en: Email your CV, transcript, and a short note on your research interests.
  - ko: 내용을 확인한 뒤 면담 일정을 잡아 연락드립니다.
    en: We will review your application and arrange a meeting.
  - ko: 면담에서 연구실 생활과 진행 중인 연구를 자세히 안내해 드립니다.
    en: In the meeting, we will walk you through ongoing research and lab life.
