      en: Adaptive investment decision support with reinforcement learning (example)
    funder:
      ko: 정부 지원 연구과제
      en: Government-funded research project
    period: 2026 – 2029
  - title:
      ko: LLM 에이전트를 활용한 금융 뉴스 분석 (예시)
      en: Financial news analysis with LLM agents (example)
    funder:
      ko: 산학협력 과제
      en: Industry collaboration
    period: 2025 – 2027
