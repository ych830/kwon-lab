# 연구 분야(areas)와 연구 과제(projects).
# areas 는 홈 화면 카드와 연구(Research) 페이지에 같이 쓰인다. 3~4개가 보기 좋다.
# image: assets/img/research/ 에 올린 그림 파일 이름 (지금은 AI 로 만든 예시 사진). 비우면 노란 자리 표시가 나온다.
#
# 연구 분야는 학교 교수진 페이지의 전문분야(경영정보시스템, 디지털 전환·프로세스 혁신, 데이터 과학·머신러닝)와
# 연구 주제를 바탕으로 쓴 초안이다. 교수님 확인 후 다듬을 것. 연구 과제(projects)는 예시다.

areas:
  - title:
      ko: AI 기반 의사결정 지원
      en: AI-Driven Decision Support
    summary:
      ko: 규칙 기반 지식과 기계학습을 결합해 상황에 맞게 판단을 돕는 의사결정 지원 시스템을 연구합니다.
      en: Decision support systems that combine rule-based knowledge with machine learning to adapt to changing situations.
    detail:
      ko: 전문가의 판단 규칙과 딥러닝·강화학습 모델을 함께 쓰는 하이브리드 의사결정 지원 시스템을 만듭니다. 시장처럼 환경이 계속 바뀌는 곳에서 전략을 스스로 조정하는 방법을 연구합니다.
      en: We build hybrid decision support systems that pair expert rules with deep learning and reinforcement learning, and study how strategies can adjust themselves in constantly changing environments such as financial markets.
    keywords: [Decision Support Systems, Reinforcement Learning, Expert Systems]
    image: decision-support.jpg

  - title:
      ko: 금융 데이터 분석·예측
      en: Financial Analytics & Forecasting
    summary:
      ko: 시계열 모델과 딥러닝으로 금융 시장의 움직임과 위험을 분석하고 예측합니다.
      en: Analyzing and forecasting market movements and risk with time-series models and deep learning.
    detail:
      ko: 변동성 예측, 페어 트레이딩, 투자자 행동 분석처럼 금융 시장 데이터를 다룹니다. 전통적인 계량 모형과 딥러닝을 결합해 더 정확하고 해석할 수 있는 예측을 목표로 합니다.
      en: We work with market data on problems such as volatility forecasting, pairs trading, and investor behavior, combining econometric models with deep learning for accurate and interpretable forecasts.
    keywords: [Time Series, Volatility Forecasting, Deep Learning]
    image: finance.jpg

  - title:
      ko: LLM 기반 시장 인사이트
      en: LLMs for Market Insight
    summary:
      ko: 뉴스 같은 텍스트 정보를 대규모 언어 모델로 정량화해 시장 예측에 활용합니다.
      en: Quantifying text such as news with large language models for market prediction.
    detail:
      ko: 숫자로 표현하기 어려운 정성 정보를 대규모 언어 모델(LLM)로 요약·정량화하고, 여러 AI 에이전트가 역할을 나눠 정보를 모으고 분석하는 구조를 연구합니다.
      en: We use large language models to summarize and quantify qualitative information that is hard to express in numbers, and study pipelines in which AI agents divide the work of collecting and analyzing information.
    keywords: [Large Language Models, AI Agents, Text Analytics]
    image: llm-news.jpg

  - title:
      ko: 디지털 전환·프로세스 혁신
      en: Digital Transformation & Process Innovation
    summary:
      ko: 경영정보시스템 관점에서 기업의 디지털 전환과 업무 프로세스 혁신을 연구합니다.
      en: Digital transformation and process innovation from a management information systems perspective.
    detail:
      ko: 제조·서비스 기업의 업무 프로세스를 분석하고, ERP·자동화·데이터 기반 운영으로 바꾸어 가는 방법을 연구합니다. 현장에 바로 적용할 수 있는 결과를 지향합니다.
      en: We analyze business processes in manufacturing and service firms and study how to transform them through ERP, automation, and data-driven operations, aiming for results that can be applied in practice.
    keywords: [Management Information Systems, ERP, Process Innovation]
    image: digital-transformation.jpg

projects:
  - title:
