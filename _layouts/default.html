{%- assign lang = page.lang | default: "ko" -%}
{%- assign t = site.data.i18n[lang] -%}
{%- assign lab = site.data.lab -%}
<!doctype html>
<html lang="{{ lang }}">
<head>
{% include head.html %}
</head>
<body>
<a class="skip-link" href="#main">{{ t.skip }}</a>
{% if lab.draft %}<div class="draft-bar">{{ t.draft_notice }}</div>{% endif %}
{% include header.html %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
<script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
